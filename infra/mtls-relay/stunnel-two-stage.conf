# Phase 3 — two-stage stunnel config: mTLS in from Vercel, real TLS out to RDS.
# Both legs encrypted end-to-end; only the loopback hop between them (Block 1
# -> Block 2, 127.0.0.1:23306) is unencrypted, and that never leaves the EC2
# instance.

pid = /var/run/stunnel/stunnel.pid
output = /var/log/stunnel/stunnel.log
foreground = no

; Block 1 — terminates Vercel's mTLS (unchanged behavior from Phase 2,
; except it now forwards to Block 2 on loopback instead of straight to RDS).
[kwanomzi-db-relay-in]
accept = 0.0.0.0:8443
connect = 127.0.0.1:23306
cert = /etc/stunnel/certs/server.crt
key = /etc/stunnel/certs/server.key
CAfile = /etc/stunnel/certs/ca.crt
verify = 2

; Block 2 — client mode: re-encrypts the outgoing leg to RDS with strict
; chain + hostname verification against Amazon's own RDS CA bundle.
[kwanomzi-db-relay-out]
client = yes
accept = 127.0.0.1:23306
connect = 172.31.29.62:3306
CAfile = /etc/stunnel/certs/rds-eu-north-1-bundle.pem
verify = 2
checkHost = kwanomzi-production.c5aggco0gclx.eu-north-1.rds.amazonaws.com
