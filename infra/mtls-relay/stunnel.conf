# stunnel config for the KwaNomzi DB mTLS relay.
# Lives on the EC2 proxy at /etc/stunnel/stunnel.conf
#
# Listens on 8443, requires a valid client certificate signed by our
# private CA, and forwards authenticated connections to RDS on the
# private VPC path (172.31.29.62:3306).

pid = /var/run/stunnel/stunnel.pid
output = /var/log/stunnel/stunnel.log
foreground = no

[kwanomzi-db-relay]
accept = 0.0.0.0:8443
connect = 172.31.29.62:3306
cert = /etc/stunnel/certs/server.crt
key = /etc/stunnel/certs/server.key
CAfile = /etc/stunnel/certs/ca.crt

# Require and verify the client certificate — this is the whole point.
# verify=2 rejects any connection that doesn't present a cert signed by CAfile.
verify = 2
